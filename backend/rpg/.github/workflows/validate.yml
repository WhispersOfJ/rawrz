name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: conventional commit title check
        if: github.event_name == 'pull_request'
        run: |
          set -e
          title="${{ github.event.pull_request.title }}"
          if ! echo "$title" | grep -qE '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\(.+\))?:'; then
            echo "::error::PR title must be a conventional commit: type(scope): subject"
            echo "Got: $title"
            exit 1
          fi

      - name: spec file sanity
        run: |
          set -e
          if [ ! -f movie-rpg-spec.md ]; then
            echo "::error::movie-rpg-spec.md missing from repo root"
            exit 1
          fi
          wc -l movie-rpg-spec.md | awk '{print "spec lines:", $1}'

  store-proof:
    # Runs the persistence proof (backend/rpg/tests/store_proof.rs) against a
    # real Postgres service container. RPG_DB_URL also activates the proof
    # inside the plain `cargo test` run, so the unit suite and the live
    # surface are exercised together.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rpg
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: rpg_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpg -d rpg_scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rpg

      - name: unit tests + store proof against scratch postgres
        working-directory: backend/rpg
        env:
          RPG_DB_URL: postgresql://rpg:scratch@localhost:5432/rpg_scratch
        run: cargo test
