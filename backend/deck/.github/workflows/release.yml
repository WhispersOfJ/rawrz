name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Skip (no RELEASE_PLEASE_TOKEN configured)
        if: env.HAS_TOKEN == 'false'
        run: |
          echo "RELEASE_PLEASE_TOKEN is not set in this repo — skipping release automation."
          echo "Add it with: gh secret set RELEASE_PLEASE_TOKEN --repo ${GITHUB_REPOSITORY} -b <pat>"
      - uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # release-please only opens PRs for feat:/fix: commits
