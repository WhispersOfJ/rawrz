name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # release-please only opens PRs for feat:/fix: commits
