name: pr-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the job only lints the PR title from the event payload.
      # A checkout here was failing intermittently on Dependabot rebases
      # ("Repository not found"), blocking green PRs for no reason.
      - name: Enforce Conventional Commits in PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|ci|refactor|test|build|perf)(\([a-z0-9-]+\))?!?: .+'; then
            echo "PR title must be a Conventional Commit: $PR_TITLE"
            exit 1
          fi
