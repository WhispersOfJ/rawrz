# M0 compose service — merged into thebearcave's docker-compose.yml by the
# submodule-bump PR (spec §3.1). Reference copy lives here.
services:
  cave-deck:
    image: ghcr.io/whispersofj/cave-deck:${CAVE_DECK_TAG:-latest}
    container_name: cave-deck
    restart: unless-stopped
    networks: [bearcave]
    ports:
      - "7780:7780"
    volumes:
      - ./config/cave-deck:/config
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt:/mnt:ro
      - /proc:/host-proc:ro
    environment:
      RUST_LOG: ${RUST_LOG:-cave_deck=info,tower_http=info}
      RADARR_URL: ${RADARR_URL:-http://radarr:7878}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-http://sonarr:8989}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-http://prowlarr:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      SEERR_URL: ${SEERR_URL:-http://seerr:5055}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      PLEX_URL: ${PLEX_URL:-http://plex:32400}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      NZBDAV_URL: ${NZBDAV_URL:-http://nzbdav:3000}
      FRONTEND_BACKEND_API_KEY: ${FRONTEND_BACKEND_API_KEY:-}
      RCLONE_URL: ${RCLONE_URL:-http://nzbdav_rclone:5572}
      NZBDAV_RCLONE_RC_USER: ${NZBDAV_RCLONE_RC_USER:-rclone}
      NZBDAV_RCLONE_RC_PASS: ${NZBDAV_RCLONE_RC_PASS:-}
      NZBDAV_MOUNTPOINT: ${NZBDAV_MOUNTPOINT:-/mnt/remote/nzbdav}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7780/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  bearcave:
    external: true
