# M3 overlay: reversible nginx ingress on host ports 8081/8443.
# Existing direct service ports remain published and unchanged.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rawrz-nginx-m3
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    networks: [bearcave]
    ports:
      - "8081:80"
      - "8443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /var/cache/nginx
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/nginx/cacheable-routes.map:/etc/nginx/cacheable-routes.map:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      seerr:
        condition: service_started
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
      prowlarr:
        condition: service_started
      nzbdav:
        condition: service_started
      plex:
        condition: service_started

networks:
  bearcave:
    name: bearcave
    external: true
