worker_processes 1;
events { worker_connections 128; }
http {
    default_type application/json;
    server {
        listen 3000;
        listen 5055;
        listen 7878;
        listen 8989;
        listen 9696;
        listen 32400;
        location / {
            add_header Cache-Control "public, max-age=60" always;
            return 200 '{"fixture":true,"route":"$uri"}\n';
        }
    }
}
