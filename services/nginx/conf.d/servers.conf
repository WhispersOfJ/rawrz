# HTTP is redirect-only for configured names. Unknown hosts are rejected.
server {
    listen 80 default_server;
    server_name _;
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
    location / { return 444; }
}

server {
    listen 80;
    server_name rawrz.lan deck.rawrz.lan rpg.rawrz.lan seerr.rawrz.lan
                radarr.rawrz.lan sonarr.rawrz.lan prowlarr.rawrz.lan
                nzbdav.rawrz.lan plex.rawrz.lan metrics.rawrz.lan grafana.rawrz.lan;
    return 308 https://$host$request_uri;
}

# Unknown TLS hosts still receive the local certificate, then are rejected.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    return 421;
}

server {
    listen 443 ssl;
    server_name rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    return 308 https://seerr.rawrz.lan$request_uri;
}

server {
    listen 443 ssl;
    server_name seerr.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    proxy_cache rawrz_seerr;
    proxy_cache_valid 200 10m;
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
    location / { proxy_pass http://seerr:5055; }
}

server {
    listen 443 ssl;
    server_name radarr.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    proxy_cache rawrz_arr;
    proxy_cache_valid 200 60s;
    location / { proxy_pass http://radarr:7878; }
}

server {
    listen 443 ssl;
    server_name sonarr.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    proxy_cache rawrz_arr;
    proxy_cache_valid 200 60s;
    location / { proxy_pass http://sonarr:8989; }
}

server {
    listen 443 ssl;
    server_name prowlarr.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    proxy_cache rawrz_arr;
    proxy_cache_valid 200 60s;
    location / { proxy_pass http://prowlarr:9696; }
}

server {
    listen 443 ssl;
    server_name nzbdav.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    proxy_cache rawrz_images;
    proxy_cache_valid 200 10m;
    location / { proxy_pass http://nzbdav:3000; }
}

server {
    listen 443 ssl;
    server_name plex.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    proxy_cache rawrz_plex;
    proxy_cache_valid 200 5m;
    location / { proxy_pass http://host.docker.internal:32400; }
}

# Services not present in the current Compose baseline remain explicit rather
# than silently routing to the wrong upstream.
server {
    listen 443 ssl;
    server_name deck.rawrz.lan rpg.rawrz.lan metrics.rawrz.lan grafana.rawrz.lan;
    ssl_certificate /etc/nginx/certs/rawrz.lan.crt;
    ssl_certificate_key /etc/nginx/certs/rawrz.lan.key;
    return 503;
}
