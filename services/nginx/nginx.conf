user nginx;
pid /var/run/nginx.pid;
worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    log_format rawrz '$remote_addr $host [$time_local] "$request" $status '
                     '$body_bytes_sent "$http_referer" "$http_user_agent" '
                     'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log rawrz;

    proxy_cache_path /var/cache/nginx/seerr levels=1:2 keys_zone=rawrz_seerr:10m max_size=256m inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/arr levels=1:2 keys_zone=rawrz_arr:10m max_size=256m inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=rawrz_images:10m max_size=512m inactive=7d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/plex levels=1:2 keys_zone=rawrz_plex:10m max_size=256m inactive=10m use_temp_path=off;

    map $upstream_cache_status $rawrz_cache_status {
        default $upstream_cache_status;
        "" BYPASS;
    }
    map $request_method $rawrz_method_bypass {
        default 1;
        GET 0;
        HEAD 0;
    }
    map $http_cookie $rawrz_cookie_bypass {
        default 1;
        "" 0;
    }
    map $http_authorization $rawrz_auth_bypass {
        default 1;
        "" 0;
    }
    map $upstream_http_cache_control $rawrz_no_store {
        default 0;
        ~*no-store 1;
        ~*private 1;
    }
    map "$host$uri" $rawrz_route_bypass {
        default 1;
        include /etc/nginx/cacheable-routes.map;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_key "$scheme$host$uri$is_args$args";
    proxy_cache_bypass $rawrz_method_bypass $rawrz_cookie_bypass $rawrz_auth_bypass $rawrz_route_bypass;
    proxy_no_cache $rawrz_method_bypass $rawrz_cookie_bypass $rawrz_auth_bypass $rawrz_route_bypass $rawrz_no_store $upstream_http_set_cookie;
    add_header X-Cache-Status $rawrz_cache_status always;

    include /etc/nginx/conf.d/*.conf;
}
