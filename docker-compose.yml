# ============================================================================
# The Bear Cave — Slim Media Stack
# ============================================================================
# 8 always-on services (2026-09-06: Bazarr re-retired per docs/services/lifecycle.md):
# prowlarr, radarr, sonarr, nzbdav, nzbdav_rclone, seerr, plex, unpackerr.
# ImageMaid and Recyclarr are available separately through the manual `maintenance` profile.
# Direct host ports (no Traefik). Full retirement record:
# docs/services/lifecycle.md
# ============================================================================

x-ca-env: &ca-env
  SSL_CERT_FILE: /etc/ssl/certs/mkcert/ca-bundle.pem
  CURL_CA_BUNDLE: /etc/ssl/certs/mkcert/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/mkcert/ca-bundle.pem
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/mkcert/rootCA.pem

x-ca-mount: &ca-mount
  source: ./config/ca
  target: /etc/ssl/certs/mkcert
  type: bind
  read_only: true

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  cpus: "0.5"
  environment: &common-env
    <<: *ca-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  logging: &common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "10"

networks:
  bearcave:
    name: bearcave

services:
  # ==========================================================================
  # Shared cache — Redis (M1)
  # ==========================================================================
  # Redis is internal-only: no host port is published. Cache namespaces are
  # ephemeral, while queue/lock users intentionally keep non-TTL keys so the
  # volatile eviction policy cannot evict durable work.
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: rawrz-redis
    mem_limit: 512m
    networks: [bearcave]
    volumes:
      - ./config/redis:/data
    environment:
      TZ: ${TZ}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Indexing — Prowlarr
  # ==========================================================================
  prowlarr:
    <<: *common
    image: ghcr.io/hotio/prowlarr:release-2.5.2.5491
    container_name: prowlarr
    mem_limit: 512m
    networks: [bearcave]
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - *ca-mount
      - ./config/prowlarr:/config

  # ==========================================================================
  # *arr apps — Radarr / Sonarr
  # ==========================================================================
  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release-6.3.0.10514
    container_name: radarr
    mem_limit: 1536m
    cpus: "1.5"
    networks: [bearcave]
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/radarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/movies:/data/movies

  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release-4.0.19.2979
    container_name: sonarr
    mem_limit: 1024m
    cpus: "1.5"
    networks: [bearcave]
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/sonarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/shows:/data/shows

  # ==========================================================================
  # Usenet — InfiniDysk (nzbdav) + rclone FUSE sidecar
  # ==========================================================================
  nzbdav:
    <<: *common
    image: ghcr.io/infinidysk/infinidysk:dev
    container_name: nzbdav
    mem_limit: 2560m
    cpus: "2.0"
    networks: [bearcave]
    depends_on:
      prowlarr:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/healthz && curl -sf \"http://localhost:3000/api?mode=queue&output=json&apikey=$${FRONTEND_BACKEND_API_KEY}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - *ca-mount
      - ./config/nzbdav:/config
      - /mnt:/mnt
      - ./media:/media:ro
    environment:
      <<: *common-env
      FRONTEND_BACKEND_API_KEY: ${FRONTEND_BACKEND_API_KEY}
      NZBDAV_CONFIG__API__KEY: ${FRONTEND_BACKEND_API_KEY}
      NZBDAV_CONFIG__API__CATEGORIES: "tv,movies"
      # Setup Guide / headless skeleton (1.3.0+): required values for Symlinks · Plex
      NZBDAV_CONFIG__API__MANUAL_CATEGORY: "uncategorized"
      NZBDAV_CONFIG__API__IGNORE_HISTORY_LIMIT: "true"
      NZBDAV_CONFIG__API__IMPORT_STRATEGY: "symlinks"
      NZBDAV_CONFIG__WEBDAV__USER: ${NZBDAV_WEBDAV_USER}
      NZBDAV_CONFIG__WEBDAV__PASS: ${NZBDAV_WEBDAV_PASS}
      # Read-only WebDAV: the mount is a streaming source; no consumer writes through it
      NZBDAV_CONFIG__WEBDAV__ENFORCE_READONLY: "true"
      NZBDAV_CONFIG__RCLONE__MOUNT_DIR: "/mnt/remote/nzbdav"
      NZBDAV_CONFIG__MEDIA__LIBRARY_DIR: "/media"
      # Two provider slots (primary + backup). The third Eweka slot was
      # retired 2026-09-06: the provider rejects its credentials server-side
      # (identical 502 for real and probe logins). Re-adoption: uncomment the
      # NZBDAV_USENET_EWEKA_* block in .env.template, fill real values, and
      # re-add the third provider object here.
      NZBDAV_CONFIG__USENET__PROVIDERS: >-
        {"Providers":[{"Type":1,"Host":"${NZBDAV_USENET_HOST}","Port":${NZBDAV_USENET_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_USER}","Pass":"${NZBDAV_USENET_PASS}","MaxConnections":50,"Priority":0,"Nickname":"primary"},{"Type":1,"Host":"${NZBDAV_USENET_BACKUP_HOST}","Port":${NZBDAV_USENET_BACKUP_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_BACKUP_USER}","Pass":"${NZBDAV_USENET_BACKUP_PASS}","MaxConnections":60,"Priority":0,"Nickname":"backup"},{"Type":1,"Host":"${NZBDAV_USENET_TERTIARY_HOST}","Port":${NZBDAV_USENET_TERTIARY_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_TERTIARY_USER}","Pass":"${NZBDAV_USENET_TERTIARY_PASS}","MaxConnections":50,"Priority":0,"Nickname":"eweka"}]}
      NZBDAV_CONFIG__USENET__CASCADE__ENABLED: "true"
      NZBDAV_CONFIG__ARR__INSTANCES: >-
        {"RadarrInstances":[{"Host":"http://radarr:7878","ApiKey":"${RADARR_API_KEY}"}],"SonarrInstances":[{"Host":"http://sonarr:8989","ApiKey":"${SONARR_API_KEY}"}],"QueueRules":[]}
      NZBDAV_CONFIG__REPAIR__ENABLE: "true"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_DEPTH: "standard"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_AGING: "true"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_CONCURRENCY: "24"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_WORKERS: "1"
      NZBDAV_CONFIG__REPAIR__AUTO_REMOVE_AFTER_FAILURES: "0"
      NZBDAV_CONFIG__REPAIR__AUTO_REMOVE_UNLINKED_ONLY: "true"
      NZBDAV_CONFIG__RCLONE__RC_ENABLED: "true"
      NZBDAV_CONFIG__RCLONE__HOST: "http://nzbdav_rclone:5572"
      NZBDAV_CONFIG__RCLONE__USER: "rclone"
      NZBDAV_CONFIG__RCLONE__PASS: ${NZBDAV_RCLONE_RC_PASS}
      NZBDAV_CONFIG__BACKUP__SCHEDULE_ENABLED: "true"
      NZBDAV_CONFIG__BACKUP__SCHEDULE_TIME: "120"
      NZBDAV_CONFIG__BACKUP__RETENTION_COUNT: "7"
      NZBDAV_CONFIG__MAINTENANCE__REMOVE_ORPHANED_SCHEDULE_ENABLED: "false"
      NZBDAV_CONFIG__MAINTENANCE__REMOVE_ORPHANED_SCHEDULE_TIME: "180"
      NZBDAV_CONFIG__QUEUE__WORKER_COUNT: "6"
      # Segment cache must stay DISABLED while the import strategy is symlinks:
      # the app warns on segment-cache.enabled=true + api.import-strategy=symlinks
      # (the two are incompatible for read-ahead). MAX_GB is kept dormant in case
      # a non-symlink strategy re-enables it later.
      NZBDAV_CONFIG__USENET__SEGMENT_CACHE__ENABLED: "false"
      NZBDAV_CONFIG__USENET__SEGMENT_CACHE__MAX_GB: "20"
      NZBDAV_CONFIG__USENET__PIPELINING__ENABLED: "true"
      NZBDAV_CONFIG__USENET__PIPELINING__DEPTH: "8"
      NZBDAV_CONFIG__USENET__MAX_DOWNLOAD_CONNECTIONS_PER_STREAM: "true"
      NZBDAV_CONFIG__USENET__MAX_DOWNLOAD_CONNECTIONS_PER_STREAM_PRESET: "medium"
      NZBDAV_CONFIG__USENET__STREAMING_PRIORITY: "80"
      NZBDAV_CONFIG__USENET__IN_FLIGHT_ARTICLE_BUDGET_MB: "2048"
      NZBDAV_CONFIG__API__ENSURE_IMPORTABLE_VIDEO: "true"
      NZBDAV_CONFIG__API__SAMPLE_FILTER_ENABLED: "true"
      NZBDAV_CONFIG__PROWLARR__URL: "http://prowlarr:9696"
      NZBDAV_CONFIG__PROWLARR__API_KEY: ${PROWLARR_API_KEY}
      NZBDAV_CONFIG__PROWLARR__SYNC_ENABLED: "true"
      NZBDAV_CONFIG__PROWLARR__SYNC_INTERVAL_MINUTES: "60"
      NZBDAV_CONFIG__PROFILES__INSTANCES: >-
        {"Profiles":[{"Token":"${NZBDAV_PROFILE_TOKEN}","Name":"Default","IndexerNames":[]}]}
      NZBDAV_CONFIG__PLAY__WATCHDOG_ENABLED: "true"
      NZBDAV_CONFIG__PLAY__VERIFY_MODE: "stat"
      NZBDAV_CONFIG__PREFLIGHT__MODE: "standard"
      NZBDAV_CONFIG__PREFLIGHT__MAX_ATTEMPTS: "8"
      NZBDAV_CONFIG__PREFLIGHT__INDEXER_MAX_WAIT_SECONDS: "3"
      NZBDAV_CONFIG__PREFLIGHT__TTL_SECONDS: "180"
      NZBDAV_CONFIG__WATCHTOWER__ENABLED: "true"
      NZBDAV_CONFIG__WATCHTOWER__PROFILE_TOKEN: ${NZBDAV_PROFILE_TOKEN}
      NZBDAV_CONFIG__WATCHTOWER__DAILY_RESOLVE_BUDGET: "15"
      NZBDAV_CONFIG__WATCHTOWER__GRAB_CAP_PER_RESOLVE: "2"
      NZBDAV_CONFIG__WATCHTOWER__RANKING: "largest"
      NZBDAV_CONFIG__WATCHTOWER__SEASON_BUNDLE_FALLBACK: "true"

  nzbdav_rclone:
    <<: *common
    image: rclone/rclone:1.75.1
    container_name: nzbdav_rclone
    # 4096m: the vfs metadata cache holds millions of entries (980k dirs + 1.1M
    # files for the ~132k-item library) during analysis; 3072m peaked at ~79%
    # RSS. Host has headroom (total caps ~11Gi against 22GiB).
    mem_limit: 4096m
    cpus: "2.0"
    networks: [bearcave]
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    volumes:
      - *ca-mount
      - /mnt/remote:/mnt/remote:rshared
      - ./config/nzbdav-rclone/rclone.conf:/config/rclone/rclone.conf
      - ./config/nzbdav-rclone/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/remote/nzbdav || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav:
        condition: service_healthy
        restart: true
    entrypoint: ["/bin/sh", "-c"]
    # NOTE: this command is a folded YAML scalar handed to `/bin/sh -c` as ONE
    # line, so `#` inside the block would comment out everything after it
    # (silently dropping the vfs tuning and the entire `--rc` server block).
    # Keep tuning rationale in YAML comments ABOVE, never inside the command.
    #
    # vfs-cache-max-size 300G: backing NVMe has ~800G free. The cache saturates
    # at its cap in steady state (99.5GB/100G observed 2026-09-04), evicting
    # LRU files on every new stream; the earlier 50G cap had pinned the cache
    # and evicted boundary files during the 553GiB library-re-analysis pass.
    # min-free-space 10G backstops the raised cap so the cache can never fill
    # the disk. Cache growth does not touch the memory cap (disk-backed).
    #
    # timeout 40s / contimeout 15s: absorb the 'net/http: timeout awaiting
    # response headers' errors seen when nzbdav is under concurrent
    # analysis+stream load.
    command:
      - >
        fusermount3 -uz /mnt/remote/nzbdav 2>/dev/null || true;
        umount -l /mnt/remote/nzbdav 2>/dev/null || true;
        exec rclone
        mount nzbdav: /mnt/remote/nzbdav
        --cache-dir=/cache
        --uid=${PUID}
        --gid=${PGID}
        --allow-other
        --links
        --vfs-cache-mode=full
        --vfs-cache-max-size=300G
        --vfs-cache-min-free-space=10G
        --vfs-cache-max-age=336h
        --buffer-size=0M
        --vfs-read-chunk-size=32M
        --vfs-read-chunk-size-limit=256M
        --vfs-read-ahead=32M
        --vfs-fast-fingerprint
        --no-checksum
        --attr-timeout=30s
        --dir-cache-time=6h
        --poll-interval=5m
        --timeout=40s
        --contimeout=15s
        --low-level-retries=5
        --rc
        --rc-addr=:5572
        --rc-user=rclone
        --rc-pass=${NZBDAV_RCLONE_RC_PASS}

  # ==========================================================================
  # Requests — Seerr
  # ==========================================================================
  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    mem_limit: 512m
    networks: [bearcave]
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - *ca-mount
      - ./config/seerr:/app/config

  # ==========================================================================
  # Ingress — nginx (M3)
  # ==========================================================================
  # Internal TLS and subdomain routing. Direct service ports remain published
  # as the rollback path until the later cutover milestone.
  nginx:
    <<: *common
    image: nginx:1.27-alpine
    container_name: rawrz-nginx
    mem_limit: 128m
    cpus: "0.25"
    networks: [bearcave]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /var/cache/nginx
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/nginx/cacheable-routes.map:/etc/nginx/cacheable-routes.map:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      seerr:
        condition: service_started
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
      prowlarr:
        condition: service_started
      nzbdav:
        condition: service_started
      plex:
        condition: service_started

  # ==========================================================================
  # Manual Plex maintenance — ImageMaid
  # ==========================================================================
  # Profile-gated and excluded from the normal eight-service startup. This
  # removes generated PhotoTranscoder cache files only; it does not resize or
  # recompress artwork, remove metadata, empty trash, clean bundles, or touch
  # the media libraries.
  imagemaid:
    image: kometateam/imagemaid:latest@sha256:ac510622d44c8fd0024d28023ec2ce32f0992271ff019db455e227bd693f0052
    profiles: [maintenance]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"
    network_mode: none
    environment:
      TZ: ${TZ}
      PLEX_PATH: /plex
      MODE: nothing
      PHOTO_TRANSCODER: "True"
      EMPTY_TRASH: "False"
      CLEAN_BUNDLES: "False"
      OPTIMIZE_DB: "False"
      SCHEDULE: ""
      LOG_REQUESTS: "False"
    logging: *common-logging
    volumes:
      - ./config/imagemaid:/config
      - ./config/plex/Plex Media Server:/plex:rw

  # ==========================================================================
  # Media server — Plex (host network: GDM/DLNA/remote access)
  # ==========================================================================
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    mem_limit: 2048m
    cpus: "4.0"
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 90s
    logging: *common-logging
    environment:
      <<: *ca-env
      TZ: ${TZ}
      PLEX_UID: "955"
      PLEX_GID: "955"
      PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR: /config
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/plex:/config
      - ./config/plex-transcode:/transcode
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
    devices:
      - /dev/dri:/dev/dri

  # ==========================================================================
  # Queue management — Unpackerr
  # ==========================================================================
  unpackerr:
    <<: *common
    image: golift/unpackerr:v0.16.1
    container_name: unpackerr
    mem_limit: 64m
    cpus: "0.1"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "grep -aq unpackerr /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./usenet:/usenet
    environment:
      <<: *common-env
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}

  # ==========================================================================
  # TRaSH config sync — Recyclarr (manual, profile-gated)
  # ==========================================================================
  # On-demand sync of TRaSH-Guides quality profiles, custom formats, scores,
  # and quality definitions into Radarr/Sonarr. Profile-gated (like ImageMaid):
  # NOT started by `docker compose up -d` — run one sync explicitly with
  #   docker compose --profile maintenance run --rm recyclarr sync
  # (or `--preview` for a dry run). Config and secrets both live in
  # config/recyclarr/ (config/recyclarr/recyclarr.yml deployed from the tracked
  # services/recyclarr/recyclarr.yml + config/recyclarr/secrets.yml generated by
  # scripts/setup.sh — never committed), mounted as one writable directory so the
  # container never binds individual files over it. Rootless image: user comes
  # from the compose `user:` property (PUID/PGID), not the PUID/PGID env vars.
  recyclarr:
    profiles: [maintenance]
    restart: "no"
    # tag: 8 (v8.x; upstream mutates the :8 tag — bump digest manually on major)
    image: ghcr.io/recyclarr/recyclarr:8@sha256:6e69e009e1cd7493ff6093e8e187b5d3788c75b4a2c0c5127b6a1beda1c19728
    mem_limit: 128m
    cpus: "0.5"
    user: "${PUID}:${PGID}"
    networks: [bearcave]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - *ca-mount
      - ./config/recyclarr:/config
    environment:
      <<: *common-env
      RECYCLARR_CREATE_CONFIG: "false"
