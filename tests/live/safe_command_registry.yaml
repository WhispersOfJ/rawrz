# ============================================================================
# tests/live/safe_command_registry.yaml — the D11 safe-command registry
# ============================================================================
# Single source of truth for what may touch the live stack outside a milestone
# demo (plan §4.2). Two sections:
#
#   safe:        commands the matrix EXECUTES, once per shell (bash/zsh/fish),
#                through the port loaders — argv exactly as recorded here.
#   excluded:    mutating / destructive commands deliberately NOT executed;
#                each row records why, so the boundary is auditable.
#
# Row fields (safe):
#   name        cave-* command (stack-* aliases resolve identically; the
#               parity harness in the submodule proves that equivalence)
#   family      registry family (spec/functions.yaml)
#   safety      safety class as recorded in spec/functions.yaml
#   argv        exact argument vector the matrix runs (use [] for none)
#   surfaces    live things it touches — arr/plex/nzbdav/seerr/docker/host/btrfs/hyprland
#   out         expected output contract (checked as a substring / rc gate)
#   since       milestone where the row became executable
#
# Invariant: every `safe[].name` and `excluded[].name` must be a
# spec/functions.yaml row in the pinned submodule; run_safe_matrix.sh enforces
# this and fails on drift. New M3 commands land as `status: pending` safe rows
# (visibility without execution) and flip to executable in the implementing PR.

safe:
  # ── core ──────────────────────────────────────────────────────────────────
  - name: cave-status
    family: core
    safety: read-only
    argv: []
    surfaces: [docker]
    out: "Container Status heading + one line per container"
    expect: "Container Status"
    since: M2
  - name: cave-version
    family: core
    safety: read-only
