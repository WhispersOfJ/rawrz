# Deterministic upstream fixtures for the M3 acceptance job. They are not part
# of production Compose and only supply the service names and Plex host target
# nginx resolves.
services:
  fixture:
    image: nginx:1.27-alpine
    restart: "no"
    networks:
      bearcave:
        aliases:
          - seerr
          - radarr
          - sonarr
          - prowlarr
          - nzbdav
          - plex
    volumes:
      - ./services/nginx/fixture.conf:/etc/nginx/nginx.conf:ro

  plex-fixture:
    image: nginx:1.27-alpine
    restart: "no"
    network_mode: host
    volumes:
      - ./services/nginx/fixture.conf:/etc/nginx/nginx.conf:ro

networks:
  bearcave:
    name: bearcave
