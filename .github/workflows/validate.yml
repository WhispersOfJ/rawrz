name: Validate
# All third-party actions are pinned to immutable commit SHAs.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "archive/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_actionlint:
        description: "Skip actionlint workflow lint"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the config-drift guard test resolves pin-change
          # dates via `git log -S` against docker-compose.yml — a depth-1
          # clone turns the synthetic merge ref into the "introducing"
          # commit and the assertion reads today's date instead of the
          # dependabot bump's.
          fetch-depth: 0

      - name: Create dummy .env
        run: cp .env.template .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Check Compose mounts
        run: python3 scripts/check_compose_mounts.py

      - name: Run guard regression tests
        run: |
          python3 scripts/test_check_compose_mounts.py
          python3 scripts/test_check_nzbdav_queue.py
          python3 scripts/test_watch_nzbdav_backend.py
          python3 scripts/test_check_bind_mount_staleness.py
          python3 scripts/test_check_radarr_profiles.py
          python3 scripts/test_check_radarr_db_size.py
          python3 scripts/test_prune_radarr_db.py
          python3 scripts/test_prune_sonarr_db.py
          python3 scripts/test_check_sonarr_refs.py
          python3 scripts/test_check_prowlarr_refs.py
          python3 scripts/test_check_secret_drift.py
          python3 scripts/test_check_python_env_transports.py
          python3 scripts/test_check_stack_tui.py
          python3 scripts/test_reclaim_docker_disk.py
          python3 scripts/test_maintenance_digest.py
          python3 scripts/test_db_growth_trend.py
          python3 scripts/test_audit_residue.py
          python3 scripts/test_check_config_drift.py
          python3 scripts/test_check_arr_import_queue.py
          python3 scripts/test_check_waybar_drift.py
          python3 scripts/test_alias_candidates.py
          python3 scripts/check_nzbdav_queue.py --offline
          python3 scripts/check_bind_mount_staleness.py --offline
          python3 scripts/check_waybar_drift.py --offline
          python3 scripts/test_drain_sonarr_queue.py
          python3 scripts/test_search_missing_scoped.py
          python3 scripts/test_arrival_notifier.py
          python3 scripts/test_activity_feed.py
          python3 scripts/test_redis_runtime.py --phase outage --key ci-m1 --value ci-m1
          python3 scripts/test_seerr_m2_patch.py
          python3 scripts/check_seerr_m2_compose.py
          python3 scripts/test_backup_dropbox.py
          bash scripts/test_setup.sh
          python3 scripts/test_check_compose_commands.py

      - name: Check Redis M1 contract
        run: |
          python3 scripts/check_redis.py
          python3 scripts/test_check_redis.py

      - name: Check Compose environment coverage
        run: |
          comm -23 \
            <(grep -ohE '\$\{[A-Z_0-9]+' docker-compose.yml | sed 's/^\${//' | sort -u) \
            <(grep -E '^[A-Z_0-9]+=' .env.template | cut -d= -f1 | sort -u) \
            > missing_vars.txt
          if [ -s missing_vars.txt ]; then
            cat missing_vars.txt
            exit 1
          fi

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: "."
          ignore_paths: "archive config services data media"

      - name: Ruff
        run: |
          pip install ruff==0.8.6
          ruff check . --exclude archive/ --exclude "**/migrations"

      - name: Check python env transports
        run: python3 scripts/check_python_env_transports.py

      - name: Bash syntax
        run: |
          for f in scripts/*.sh scripts/git-hooks/* tests/*/*.sh \
                   services/bash-functions/waybar/scripts/*.sh; do
            bash -n "$f"
          done
          # The Shellcheck action ignores services/ (app config dirs), so
          # lint the tracked waybar dotfile script here explicitly.
          shellcheck services/bash-functions/waybar/scripts/*.sh

      - name: Bash functions
        run: ./tests/bash/test_bash_functions.sh --offline

      - name: Actionlint
        if: ${{ github.event.inputs.skip_actionlint != 'true' }}
        run: |
          # Release binary of actionlint v1.7.12, checksum-verified against the
          # official release asset actionlint_1.7.12_checksums.txt. Keep this,
          # AL_VERSION in scripts/preflight.sh, and the .pre-commit-config.yaml
          # hook rev in sync so CI and local pre-commit run the same build.
          ACTIONLINT_VERSION="1.7.12"
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
