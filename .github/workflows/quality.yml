name: Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yamllint
        run: python3 -m pip install yamllint==1.37.1
      - name: Lint YAML
        run: 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" docker-compose.yml .github/*.yml .github/workflows/*.yml'

  # The former shell-and-python job was retired in M0: its bash -n, bash
  # functions, and ruff gates all run in validate.yml's `validate` job (and are
  # mirrored by the pre-commit gate), so keeping a second copy only doubled the
  # runtime without adding coverage.
