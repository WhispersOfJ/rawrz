name: CodeQL Security Analysis
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "22 3 * * 1" # Monday 03:22 UTC
  workflow_dispatch:
    inputs:
      language:
        description: "Language to scan"
        required: false
        default: all
        type: choice
        options:
          - all
          - python
          - javascript-typescript

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Default set: the stack's Python tooling plus the Deck's
        # JavaScript/TypeScript frontend. Rust analysis is deliberately not
        # enabled in M0: CodeQL's Rust support needs a build recipe for two
        # independent crates, and the repo has no verified configuration for
        # it yet. Add it with a tested recipe rather than an untested guess.
        language: ${{ (github.event.inputs.language && github.event.inputs.language != 'all') && fromJSON(format('["{0}"]', github.event.inputs.language)) || fromJSON('["python","javascript-typescript"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
